<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Masjid - Layar TV Utama</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#062b2b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="img/logo-aljihad-circle.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="css/display-theme.css?v=3.0.5">
    <link rel="stylesheet" href="css/partials-theme.css?v=3.0.5">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background-color: #050505;
            width: 100vw;
            height: 100vh;
        }

        .iframe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #050505;
            will-change: opacity;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        iframe.active {
            opacity: 1;
            z-index: 2;
            pointer-events: auto;
        }

        iframe.outgoing {
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Prayer Mode Fullscreen Overlay Frame */
        #prayerFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 500;
            border: none;
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        #prayerFrame.active {
            display: block;
            opacity: 1;
        }

        /* Royal Emerald Splash Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0d4a2b 0%, #052917 55%, #01140b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.6s ease;
        }

        .splash-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: splashFadeIn 0.8s ease-out;
        }

        @keyframes splashFadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .splash-logo-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .splash-spinner-ring {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 3px solid rgba(212, 175, 55, 0.15);
            border-top: 3px solid #FFD700;
            border-right: 3px solid rgba(255, 215, 0, 0.6);
            animation: splashSpin 1.4s linear infinite;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
        }

        @keyframes splashSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .splash-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
        }

        .splash-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: #FFFFFF;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.4);
            margin-bottom: 14px;
        }

        .splash-loading-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 22px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(212, 175, 55, 0.4);
            font-size: 0.95rem;
            color: #E2E8F0;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .splash-dot {
            width: 8px;
            height: 8px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 8px #FFD700;
            animation: splashDotPulse 1.2s infinite alternate;
        }

        @keyframes splashDotPulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Remote TV Control OSD Notification */
        .tv-osd {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1.5px solid #ffd700;
            padding: 8px 18px;
            border-radius: 25px;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 900;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .tv-osd.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Remote Emergency Alert Overlay Banner */
        .emergency-banner-overlay {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            max-width: 90vw;
            width: auto;
            min-width: 480px;
            padding: 16px 28px;
            background: linear-gradient(135deg, rgba(185, 28, 28, 0.96), rgba(127, 29, 29, 0.98));
            border: 2px solid #ffd700;
            border-radius: 18px;
            color: #ffffff;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85), 0 0 30px rgba(255, 215, 0, 0.45);
            z-index: 950;
            display: none;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
        }
        .emergency-banner-overlay.show {
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .emergency-banner-overlay.theme-gold {
            background: linear-gradient(135deg, rgba(202, 138, 4, 0.96), rgba(161, 98, 7, 0.98));
        }
        .emergency-banner-overlay.theme-green {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.96), rgba(4, 120, 87, 0.98));
        }
        .emergency-icon {
            font-size: 2.2rem;
            color: #ffd700;
            animation: pulseAlert 1.5s infinite alternate;
        }
        @keyframes pulseAlert {
            0% { transform: scale(0.92); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 10px #ffd700); }
        }
        .emergency-text {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }
        .emergency-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <!-- Splash Screen Awal -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="splash-card">
            <div class="splash-logo-wrapper">
                <div class="splash-spinner-ring"></div>
                <img src="image/display/logo_aljihad.png" alt="Logo Masjid" class="splash-logo-img" onerror="this.onerror=null;this.src='img/logo-aljihad-circle.png';">
            </div>
            <div class="splash-title" id="splashTitle">MASJID JAMI' AL JIHAD</div>
            <div class="splash-loading-pill">
                <span class="splash-dot"></span>
                <span id="splashStatus">MENGHUBUNGKAN CLOUD...</span>
            </div>
        </div>
    </div>

    <!-- OSD Notifikasi Remote TV -->
    <div class="tv-osd" id="tvOsd">Slide 1/2</div>

    <!-- Remote Emergency Alert Overlay Banner -->
    <div id="emergencyBanner" class="emergency-banner-overlay">
        <i class="fas fa-bullhorn emergency-icon" id="emergencyIcon"></i>
        <div>
            <div class="emergency-text" id="emergencyText">Pemberitahuan Khusus DKM</div>
            <div class="emergency-sub" id="emergencySub">Siaran Langsung Pengurus Masjid Jami' Al-Jihad</div>
        </div>
    </div>

    <!-- Dual Iframe Crossfade Engine -->
    <div class="iframe-container">
        <iframe id="frame1" class="active" src="about:blank"></iframe>
        <iframe id="frame2" class="outgoing" src="about:blank"></iframe>
    </div>

    <!-- Prayer Mode Frame (Diaktifkan Otomatis Saat Waktu Sholat) -->
    <iframe id="prayerFrame" src="prayer-mode.html"></iframe>

    <!-- SUPABASE & CORE SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-db.js"></script>
    <script src="js/prayer-engine.js"></script>

    <script>
        // Pemetaan rute canonical ke path file statis
        const PATH_MAPPING = {
            '/utama-embed': 'slides/utama.html',
            '/jumat-embed': 'slides/jumat.html',
            '/keuangan-embed': 'slides/keuangan.html',
            '/pengumuman-embed': 'slides/pengumuman.html',
            '/keuangan-summary-embed': 'slides/keuangan-summary.html',
            '/qris-embed': 'slides/qris.html',
            '/slide-embed': 'slides/slide.html',
            '/ambulance-embed': 'slides/ambulance.html',
            '/infaq-embed': 'slides/infaq.html',
            '/hikmah-embed': 'slides/hikmah.html',
            '/yasin-embed': 'slides/yasin.html',
            '/live-mekah-embed': 'slides/live-mekah.html',
            '/live-madinah-embed': 'slides/live-madinah.html',
            '/live-mimbar-embed': 'slides/live-mimbar.html',
            '/idul-fitri-embed': 'slides/idul-fitri.html',
            '/idul-adha-embed': 'slides/idul-adha.html',
            '/qurban-embed': 'slides/qurban.html',
            '/ramadhan-embed': 'slides/ramadhan.html',
            '/kajian-embed': 'slides/kajian.html'
        };

        // Default rotation pages jika database belum memiliki susunan
        const DEFAULT_PAGES = [
            'slides/utama.html',
            'slides/jumat.html'
        ];

        let activePages = [];
        let currentIndex = 0;
        let rotationTimer = null;
        let rotationInterval = 10000;
        let isPaused = false;
        let currentFrame = 1;
        let isPrayerModeActive = false;

        let settings = null;
        let jadwalList = [];
        let jumatPetugas = null;

        function showOsd(text) {
            const el = document.getElementById('tvOsd');
            if (!el) return;
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(el.hideTimeout);
            el.hideTimeout = setTimeout(() => {
                el.classList.remove('show');
            }, 2000);
        }

        // Resolusi daftar slide aktif dari settings (dengan pemekaran dinamis multi-program infaq)
        function resolveActivePages(appSettings, programInfaqList = []) {
            const list = [];
            let activeInfaqPrograms = [];

            if (Array.isArray(programInfaqList) && programInfaqList.length > 0) {
                activeInfaqPrograms = programInfaqList.filter(p => p.is_active === true);
            } else {
                try {
                    const cached = localStorage.getItem('cached_program_infaq');
                    if (cached) {
                        const parsed = JSON.parse(cached);
                        activeInfaqPrograms = parsed.filter(p => p.is_active === true);
                    }
                } catch (e) {}
            }

            if (appSettings && Array.isArray(appSettings.rotation_pages)) {
                appSettings.rotation_pages.forEach(p => {
                    if (p.active !== false) {
                        const localPath = PATH_MAPPING[p.page] || p.path || p.page;
                        
                        // Khusus untuk Slide Infaq: Periksa apakah ada program aktif
                        if (localPath === 'slides/infaq.html' || p.page === '/infaq-embed') {
                            if (activeInfaqPrograms.length > 1) {
                                // Jika ada 2 atau lebih program penggalangan infaq aktif:
                                // Otomatis muncul slide baru untuk setiap program (1 program per slide di TV)
                                activeInfaqPrograms.forEach(prog => {
                                    const progUrl = `slides/infaq.html?id=${prog.id}`;
                                    if (!list.includes(progUrl)) list.push(progUrl);
                                });
                            } else if (activeInfaqPrograms.length === 1) {
                                const progUrl = `slides/infaq.html?id=${activeInfaqPrograms[0].id}`;
                                if (!list.includes(progUrl)) list.push(progUrl);
                            }
                            // Jika activeInfaqPrograms.length === 0 (semua program ditutup/selesai):
                            // Slide infaq otomatis TIDAK dimasukkan ke rotasi TV!
                        } else if (localPath && !list.includes(localPath)) {
                            list.push(localPath);
                        }
                    }
                });
            }

            if (list.length === 0) {
                return DEFAULT_PAGES;
            }
            return list;
        }

        // Pergantian slide TV dengan crossfade mulus
        function switchSlide(targetIndex) {
            if (activePages.length === 0 || isPrayerModeActive) return;

            currentIndex = (targetIndex + activePages.length) % activePages.length;
            const nextUrl = activePages[currentIndex];

            const frontFrame = currentFrame === 1 ? document.getElementById('frame1') : document.getElementById('frame2');
            const backFrame = currentFrame === 1 ? document.getElementById('frame2') : document.getElementById('frame1');

            // Muat URL di frame latar belakang
            backFrame.src = nextUrl;

            backFrame.onload = function() {
                // Crossfade
                backFrame.className = 'active';
                frontFrame.className = 'outgoing';

                currentFrame = currentFrame === 1 ? 2 : 1;
                showOsd(`Slide ${currentIndex + 1}/${activePages.length}`);
            };
        }

        function nextPage() {
            switchSlide(currentIndex + 1);
        }

        function prevPage() {
            switchSlide(currentIndex - 1);
        }

        function togglePause() {
            isPaused = !isPaused;
            showOsd(isPaused ? '⏸ Rotasi Dijeda' : '▶ Rotasi Dilanjutkan');
            if (!isPaused) {
                scheduleNextRotation();
            } else {
                clearTimeout(rotationTimer);
            }
        }

        // Lompat langsung ke slide tertentu berdasarkan URL atau rute
        function jumpToSlideUrl(url, label = '') {
            if (!url || isPrayerModeActive) return;
            const targetIdx = activePages.findIndex(p => p.includes(url) || url.includes(p));
            if (targetIdx !== -1) {
                switchSlide(targetIdx);
            } else {
                // Jika URL tidak ada di rotasi normal (misal slide khusus / CCTV), muat langsung di frame
                const frontFrame = currentFrame === 1 ? document.getElementById('frame1') : document.getElementById('frame2');
                const backFrame = currentFrame === 1 ? document.getElementById('frame2') : document.getElementById('frame1');
                backFrame.src = url;
                backFrame.onload = function() {
                    backFrame.className = 'active';
                    frontFrame.className = 'outgoing';
                    currentFrame = currentFrame === 1 ? 2 : 1;
                    showOsd(label ? `📺 ${label}` : '📺 Slide Khusus');
                };
            }
        }

        // Tampilkan Banner Siaran Darurat / Pengumuman Jarak Jauh
        let emergencyAlertTimer = null;
        function showEmergencyAlert(text, theme = 'red', duration = 30) {
            const banner = document.getElementById('emergencyBanner');
            const txt = document.getElementById('emergencyText');
            if (!banner || !txt) return;

            txt.textContent = text;
            banner.className = 'emergency-banner-overlay show';
            if (theme === 'gold') banner.classList.add('theme-gold');
            else if (theme === 'green') banner.classList.add('theme-green');

            clearTimeout(emergencyAlertTimer);
            if (duration && duration > 0) {
                emergencyAlertTimer = setTimeout(() => {
                    hideEmergencyAlert();
                }, duration * 1000);
            }
        }

        function hideEmergencyAlert() {
            const banner = document.getElementById('emergencyBanner');
            if (!banner) return;
            banner.classList.remove('show');
            clearTimeout(emergencyAlertTimer);
        }

        function scheduleNextRotation() {
            clearTimeout(rotationTimer);
            if (isPaused || isPrayerModeActive || activePages.length <= 1) return;

            rotationTimer = setTimeout(() => {
                nextPage();
                scheduleNextRotation();
            }, rotationInterval);
        }

        // Pantau waktu sholat (Prayer Mode Engine)
        function checkPrayerMode() {
            if (!window.PrayerEngine) return;
            const now = new Date();
            const state = window.PrayerEngine.getPrayerState(settings, jadwalList, jumatPetugas, now);

            const prayerFrame = document.getElementById('prayerFrame');

            // 1. Prioritas Utama: Prayer Mode (Adzan / Iqamah / Sholat Berjamaah)
            if (state.active) {
                if (!isPrayerModeActive) {
                    console.log('🕌 Memasuki Mode Sholat:', state.phase, state.prayer);
                    isPrayerModeActive = true;
                    clearTimeout(rotationTimer);
                    prayerFrame.classList.add('active');
                }
                return;
            } else {
                if (isPrayerModeActive) {
                    console.log('✅ Mode Sholat selesai. Kembali ke rotasi TV.');
                    isPrayerModeActive = false;
                    prayerFrame.classList.remove('active');
                    scheduleNextRotation();
                }
            }

            // 2. Prioritas Kedua: Agenda Malam Jum'at (Surat Yaasiin ba'da Maghrib s/d Isya)
            if (state.yasin_active) {
                if (localStorage.getItem('lockPageRotation') !== 'yasin') {
                    console.log('📖 Agenda Malam Jum\'at Aktif: Mengunci layar pada Surat Yaasiin.');
                    localStorage.setItem('lockPageRotation', 'yasin');
                    const targetFrame = currentFrame === 1 ? document.getElementById('frame1') : document.getElementById('frame2');
                    targetFrame.src = 'slides/yasin.html';
                    clearTimeout(rotationTimer);
                    showOsd('📖 Agenda Malam Jum\'at: Surat Yaasiin');
                }
            } else if (localStorage.getItem('lockPageRotation') === 'yasin') {
                console.log('✅ Agenda Malam Jum\'at selesai. Mengembalikan rotasi normal.');
                localStorage.removeItem('lockPageRotation');
                scheduleNextRotation();
            }

            // 3. Prioritas Ketiga: Pengajian Rutin Malam Ahad (Kajian Sabtu Ba'da Maghrib s/d Isya)
            if (state.kajian_active) {
                if (localStorage.getItem('lockPageRotation') !== 'kajian') {
                    console.log('🕌 Pengajian Rutin Malam Ahad Aktif: Mengunci layar pada Slide Kajian.');
                    localStorage.setItem('lockPageRotation', 'kajian');
                    const targetFrame = currentFrame === 1 ? document.getElementById('frame1') : document.getElementById('frame2');
                    targetFrame.src = 'slides/kajian.html';
                    clearTimeout(rotationTimer);
                    showOsd('🕌 Pengajian Rutin Malam Ahad: Majelis Ilmu');
                }
            } else if (localStorage.getItem('lockPageRotation') === 'kajian') {
                console.log('✅ Pengajian Rutin Malam Ahad selesai. Mengembalikan rotasi normal.');
                localStorage.removeItem('lockPageRotation');
                scheduleNextRotation();
            }
        }

        // Callback ketika prayer-mode.html selesai
        window.onPrayerModeEnd = function() {
            isPrayerModeActive = false;
            document.getElementById('prayerFrame').classList.remove('active');
            scheduleNextRotation();
        };

        // Inisialisasi Utama
        async function initDisplay() {
            const statusEl = document.getElementById('splashStatus');
            try {
                if (statusEl) statusEl.textContent = 'MEMUAT DATA SUPABASE...';

                // 1. Ambil settings & data program infaq
                settings = await SupabaseDB.getSettings();
                let programInfaqList = [];
                try {
                    programInfaqList = await SupabaseDB.getProgramInfaq();
                } catch (e) {}

                if (settings) {
                    if (settings.nama_aplikasi) {
                        document.getElementById('splashTitle').textContent = settings.nama_aplikasi;
                        document.title = settings.nama_aplikasi + ' - Display TV';
                    }
                    if (settings.rotation_interval) {
                        rotationInterval = Math.max(1, parseInt(settings.rotation_interval)) * 1000;
                    }
                    activePages = resolveActivePages(settings, programInfaqList);
                }

                // 2. Ambil jadwal & petugas Jumat
                jadwalList = await SupabaseDB.getJadwalSholat();
                jumatPetugas = await SupabaseDB.getSholatJumat();

                // 3. Muat slide pertama
                if (activePages.length > 0) {
                    document.getElementById('frame1').src = activePages[0];
                    currentIndex = 0;
                }

                // 4. Sembunyikan splash screen
                setTimeout(() => {
                    const overlay = document.getElementById('loadingOverlay');
                    if (overlay) {
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 600);
                    }
                    scheduleNextRotation();
                }, 1200);

            } catch (err) {
                console.error('Inisialisasi gagal:', err);
                if (statusEl) statusEl.textContent = 'MEMUAT MODE CADANGAN...';
                activePages = DEFAULT_PAGES;
                document.getElementById('frame1').src = activePages[0];
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    scheduleNextRotation();
                }, 1000);
            }
        }

        // Listener Keyboard / Remote TV
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowRight':
                case 'MediaTrackNext':
                    nextPage();
                    scheduleNextRotation();
                    break;
                case 'ArrowLeft':
                case 'MediaTrackPrevious':
                    prevPage();
                    scheduleNextRotation();
                    break;
                case ' ':
                case 'MediaPlayPause':
                    e.preventDefault();
                    togglePause();
                    break;
                case 'r':
                case 'R':
                    location.reload();
                    break;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initDisplay();
            setInterval(checkPrayerMode, 1000);

            // Pasang Realtime WebSocket Listener Supabase
            if (window.SupabaseDB) {
                SupabaseDB.subscribeRealtime((payload) => {
                    console.log('⚡ [Realtime Index] Perubahan terdeteksi:', payload.table);
                    if (payload.table === 'app_settings') {
                        Promise.all([SupabaseDB.getSettings(), SupabaseDB.getProgramInfaq()]).then(([newSettings, progs]) => {
                            settings = newSettings;
                            if (settings && settings.rotation_interval) {
                                rotationInterval = Math.max(1, parseInt(settings.rotation_interval)) * 1000;
                            }
                            activePages = resolveActivePages(settings, progs);
                            showOsd('⚡ Pengaturan Diperbarui (Realtime)');
                        });
                    } else if (payload.table === 'program_infaq') {
                        Promise.all([SupabaseDB.getSettings(), SupabaseDB.getProgramInfaq()]).then(([currSettings, progs]) => {
                            if (currSettings) settings = currSettings;
                            activePages = resolveActivePages(settings, progs);
                            showOsd('⚡ Rotasi Program Infaq Diperbarui (Realtime)');
                        });
                    } else if (payload.table === 'jadwal_sholat') {
                        SupabaseDB.getJadwalSholat().then(list => jadwalList = list);
                    } else if (payload.table === 'sholat_jumat') {
                        SupabaseDB.getSholatJumat().then(petugas => jumatPetugas = petugas);
                    }
                });
            }

            // Pasang Pendengar Remote Control Supabase (Perintah Jarak Jauh Super Admin)
            if (window.SupabaseDB && typeof SupabaseDB.subscribeRemoteCommands === 'function') {
                SupabaseDB.subscribeRemoteCommands((payload) => {
                    const cmd = (payload.command || '').toUpperCase();
                    const d = payload.data || {};
                    console.log('📡 [TV Remote Command Received]:', cmd, d);

                    switch (cmd) {
                        case 'NEXT':
                            nextPage();
                            scheduleNextRotation();
                            showOsd('🎮 Remote: Slide Berikutnya');
                            break;
                        case 'PREV':
                            prevPage();
                            scheduleNextRotation();
                            showOsd('🎮 Remote: Slide Sebelumnya');
                            break;
                        case 'PAUSE':
                            if (!isPaused) togglePause();
                            break;
                        case 'RESUME':
                            if (isPaused) togglePause();
                            break;
                        case 'TOGGLE_PAUSE':
                            togglePause();
                            break;
                        case 'JUMP':
                            jumpToSlideUrl(d.url, d.name);
                            break;
                        case 'RELOAD':
                            showOsd('🔄 Remote: Memuat Ulang TV...');
                            setTimeout(() => location.reload(), 1200);
                            break;
                        case 'EMERGENCY_ALERT':
                            showEmergencyAlert(d.text, d.theme, d.duration || 30);
                            showOsd('📢 Peringatan Siaran Darurat Masuk');
                            break;
                        case 'CLEAR_ALERT':
                            hideEmergencyAlert();
                            showOsd('✅ Peringatan Dihapus');
                            break;
                        case 'PING':
                            showOsd('📡 Ping Sukses dari Super Admin (Online)');
                            break;
                    }
                });

                // Daftarkan Status Kehadiran (Presence Heartbeat) Perangkat TV ke Cloud
                setTimeout(() => {
                    try {
                        SupabaseDB.trackDevicePresence({
                            device_id: 'TV_MASJID_UTAMA',
                            device_name: 'TV Layar Utama Masjid Jami\' Al-Jihad',
                            resolution: `${window.innerWidth}x${window.innerHeight}`,
                            current_slide: (activePages && activePages[currentIndex]) ? activePages[currentIndex] : 'slides/utama.html'
                        });
                    } catch (e) {}
                }, 2000);
            }

            // PWA Service Worker Registration
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then((reg) => {
                    console.log('✅ [PWA] Service Worker aktif:', reg.scope);
                }).catch((err) => {
                    console.log('ℹ️ [PWA] Service Worker info:', err);
                });
            }

            // Network Connectivity Resilience Listener (Offline Toast Indicator)
            window.addEventListener('offline', () => {
                showOsd('📡 Mode Offline Aktif - Menggunakan Data Cache Lokal');
            });
            window.addEventListener('online', () => {
                showOsd('⚡ Terhubung Kembali ke Internet');
            });

            // Touch Swipe Handler for Mobile & Tablet Devices (Swipe Left/Right to Switch Slides)
            let touchStartX = 0;
            let touchEndX = 0;
            document.addEventListener('touchstart', (e) => {
                if (e.changedTouches && e.changedTouches[0]) {
                    touchStartX = e.changedTouches[0].screenX;
                }
            }, { passive: true });
            document.addEventListener('touchend', (e) => {
                if (e.changedTouches && e.changedTouches[0]) {
                    touchEndX = e.changedTouches[0].screenX;
                    const diff = touchEndX - touchStartX;
                    if (Math.abs(diff) > 60) {
                        if (diff < 0) {
                            nextPage();
                        } else {
                            prevPage();
                        }
                        scheduleNextRotation();
                    }
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
