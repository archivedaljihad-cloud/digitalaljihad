    <script>
        // =========================================================================
        // SRE TELEMETRY, OBSERVABILITY & ERROR BOUNDARY (SRE / DEVSECOPS)
        // =========================================================================
        window.__SRE_TELEMETRY__ = {
            version: '5.5.0',
            startTime: Date.now(),
            lastSlideSwitchTime: Date.now(),
            totalRotations: 0,
            errorCount: 0,
            events: [],
            log(type, message, details = null) {
                const entry = {
                    timestamp: new Date().toISOString(),
                    type,
                    message,
                    details
                };
                this.events.unshift(entry);
                if (this.events.length > 50) this.events.pop();
                console.log(`[SRE Telemetry][${type}] ${message}`, details || '');
            }
        };

        window.addEventListener('error', (event) => {
            if (window.__SRE_TELEMETRY__) {
                window.__SRE_TELEMETRY__.errorCount++;
                window.__SRE_TELEMETRY__.log('ERROR', event.message, {
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno
                });
            }
            return false;
        });

        window.addEventListener('unhandledrejection', (event) => {
            if (window.__SRE_TELEMETRY__) {
                window.__SRE_TELEMETRY__.errorCount++;
                window.__SRE_TELEMETRY__.log('UNHANDLED_REJECTION', event.reason ? (event.reason.message || String(event.reason)) : 'Promise rejected');
            }
        });

        // Pemetaan rute canonical ke path file statis
        const PATH_MAPPING = {

            '/jumat-embed': 'slides/jumat.html',
            '/keuangan-embed': 'slides/keuangan.html',

            '/qris-embed': 'slides/qris.html',
            '/slide-embed': 'slides/slide.html',
            '/ambulance-embed': 'slides/ambulance.html',
            '/infaq-embed': 'slides/infaq.html',
            '/hikmah-embed': 'slides/hikmah.html',

            '/agenda-rutin-embed': 'slides/agenda-rutin.html',
            '/undangan-embed': 'slides/undangan.html',
            '/kas-jumat-embed': 'slides/kas-jumat.html'
        };

        // Default rotation pages jika database belum memiliki susunan
        const DEFAULT_PAGES = [
            'slides/utama.html',
            'slides/jumat.html'
        ];

        let activePages = [];
        let currentIndex = 0;
        let rotationTimer = null;
        // Baca langsung preferensi durasi dari LocalStorage agar sejak milidetik pertama durasi rotasi sudah tepat
        const _savedRotInterval = (() => {
            const direct = localStorage.getItem('display_rotation_interval');
            if (direct && !isNaN(parseInt(direct))) return Math.max(1, parseInt(direct));
            try {
                const cached = localStorage.getItem('cached_app_settings');
                if (cached) {
                    const p = JSON.parse(cached);
                    if (p && p.rotation_interval && !isNaN(parseInt(p.rotation_interval))) {
                        return Math.max(1, parseInt(p.rotation_interval));
                    }
                }
            } catch (e) {}
            return 10;
        })();
        let rotationInterval = _savedRotInterval * 1000;
        let isPaused = false;
        let currentFrame = 1;
        let isPrayerModeActive = false;
        let isYasinModeActive = false;
        let isKajianModeActive = false;

        let settings = null;
        let jadwalList = [];
        let jumatPetugas = null;

        function showOsd(text) {
            // Dinonaktifkan total sesuai permintaan pengguna: Layar TV display bersih tanpa gangguan kotak kapsul OSD
            const el = document.getElementById('tvOsd');
            if (el) el.style.display = 'none';
            return;
        }

        // Pembaruan teks footer copyright display TV (Bisa diedit Super Admin)
        function updateMasterFooter(text) {
            const el = document.getElementById('masterFooterContent');
            if (el) {
                el.textContent = text || "© 2026 MASJID JAMI' AL JIHAD (GRAHA ASRI). All Rights Reserved";
            }
        }

        // Daftarkan Status Kehadiran & Heartbeat Realtime Layar TV ke Cloud (Tingkat Global)
        function broadcastTvState() {
            try {
                if (typeof SupabaseDB !== 'undefined' && typeof SupabaseDB.trackDevicePresence === 'function') {
                    const curSlide = (activePages && activePages[currentIndex]) ? activePages[currentIndex] : 'slides/utama.html';
                    const cleanName = curSlide.replace(/^slides\//, '').replace(/\.html$/, '').replace(/-/g, ' ').toUpperCase();
                    const total = (activePages && activePages.length) ? activePages.length : 19;
                    SupabaseDB.trackDevicePresence({
                        type: 'tv-display',
                        device_id: 'TV_MASJID_UTAMA',
                        device_name: 'TV Layar Utama Masjid Jami\' Al-Jihad',
                        current_slide: curSlide,
                        currentSlide: curSlide,
                        currentSlideTitle: `Slide ${cleanName} (${currentIndex + 1}/${total})`,
                        resolution: `${window.innerWidth} x ${window.innerHeight} px`,
                        width: window.innerWidth,
                        height: window.innerHeight,
                        userAgent: navigator.userAgent || 'Smart TV Browser',
                        isPaused: isPaused,
                        is_paused: isPaused,
                        last_heartbeat: Date.now()
                    });
                }
            } catch (e) {
                console.warn('[Display TV] Gagal broadcast state TV:', e);
            }
        }
        window.broadcastTvState = broadcastTvState;

        // Resolusi daftar slide aktif dari settings (dengan pemekaran dinamis multi-program infaq & smart scheduling)
        function resolveActivePages(appSettings, programInfaqList = []) {
            const list = [];
            let activeInfaqPrograms = [];

            if (Array.isArray(programInfaqList) && programInfaqList.length > 0) {
                activeInfaqPrograms = programInfaqList.filter(p => p.is_active === true);
            } else {
                try {
                    const cached = localStorage.getItem('cached_program_infaq');
                    if (cached) {
                        const parsed = JSON.parse(cached);
                        activeInfaqPrograms = parsed.filter(p => p.is_active === true);
                    }
                } catch (e) {}
            }

            // Smart Scheduling: Deteksi apakah hari ini adalah hari Jum'at (5)
            const now = new Date();
            const isFriday = (now.getDay() === 5);
            const urlParams = new URLSearchParams(window.location.search);
            const isForceTestJumat = urlParams.has('test_jumat') || urlParams.has('preview_all');

            if (appSettings && Array.isArray(appSettings.rotation_pages)) {
                appSettings.rotation_pages.forEach(p => {
                    if (p.active !== false) {
                        const localPath = PATH_MAPPING[p.page] || p.path || p.page;
                        
                        // 1. Khusus Slide Maklumat & Kas Jum'at (Smart Scheduling):
                        // Otomatis HANYA tayang pada hari Jum'at (now.getDay() === 5)
                        if (localPath === 'slides/kas-jumat.html' || p.page === '/kas-jumat-embed') {
                            if (isFriday || isForceTestJumat) {
                                if (!list.includes(localPath)) list.push(localPath);
                            }
                            // Di luar hari Jum'at: otomatis di-skip (tidak mengganggu rotasi hari biasa)
                        }
                        // 2. Khusus untuk Slide Infaq: Periksa apakah ada program aktif
                        else if (localPath === 'slides/infaq.html' || p.page === '/infaq-embed') {
                            if (activeInfaqPrograms.length > 1) {
                                // Jika ada 2 atau lebih program penggalangan infaq aktif:
                                // Otomatis muncul slide baru untuk setiap program (1 program per slide di TV)
                                activeInfaqPrograms.forEach(prog => {
                                    const progUrl = `slides/infaq.html?id=${prog.id}`;
                                    if (!list.includes(progUrl)) list.push(progUrl);
                                });
                            } else if (activeInfaqPrograms.length === 1) {
                                const progUrl = `slides/infaq.html?id=${activeInfaqPrograms[0].id}`;
                                if (!list.includes(progUrl)) list.push(progUrl);
                            }
                            // Jika activeInfaqPrograms.length === 0 (semua program ditutup/selesai):
                            // Slide infaq otomatis TIDAK dimasukkan ke rotasi TV!
                        } else if (localPath && !list.includes(localPath)) {
                            list.push(localPath);
                        }
                    }
                });
            }

            if (list.length === 0) {
                return DEFAULT_PAGES;
            }
            return list;
        }

        let slideTransitionFailsafe = null;
        let isTransitioning = false;

        // Proaktif preload slide berikutnya di frame latar belakang (background pre-warm tanpa beban)
        function preloadNextSlide() {
            if (activePages.length <= 1 || isPrayerModeActive) return;
            const nextIdx = (currentIndex + 1) % activePages.length;
            const nextUrl = activePages[nextIdx];
            const backFrame = currentFrame === 1 ? document.getElementById('frame2') : document.getElementById('frame1');
            
            // Muat senyap hanya jika URL di backFrame belum sesuai
            if (backFrame && backFrame.dataset.loadedUrl !== nextUrl) {
                backFrame.dataset.loadedUrl = '';
                backFrame.dataset.isReady = 'false';
                backFrame.className = 'incoming';
                
                backFrame.onload = function() {
                    backFrame.dataset.loadedUrl = nextUrl;
                    backFrame.dataset.isReady = 'true';
                    try {
                        if (backFrame.contentWindow) {
                            backFrame.contentWindow.postMessage({
                                type: 'INIT_DISPLAY_DATA',
                                settings: settings,
                                jumatPetugas: jumatPetugas,
                                jadwalList: jadwalList,
                                programInfaqList: window.programInfaqList || []
                            }, '*');
                        }
                    } catch(e) {}
                };
                backFrame.onerror = function() {
                    backFrame.dataset.isReady = 'true';
                };
                backFrame.src = nextUrl;
            }
        }

        // Pergantian slide TV: Ultra-Smooth Over-Fade Cross-Dissolve (Zero Stutter, Zero Scale Jitter, Zero Dark Dip)
        function switchSlide(targetIndex) {
            if (activePages.length === 0 || isPrayerModeActive || isYasinModeActive || isKajianModeActive) return;
            if (isTransitioning) {
                console.warn('⚠️ [Display TV] switchSlide: Transisi sebelumnya masih berlangsung.');
                return;
            }

            currentIndex = (targetIndex + activePages.length) % activePages.length;
            const nextUrl = activePages[currentIndex];

            const frontFrame = currentFrame === 1 ? document.getElementById('frame1') : document.getElementById('frame2');
            const backFrame = currentFrame === 1 ? document.getElementById('frame2') : document.getElementById('frame1');

            isTransitioning = true;
            let transitioned = false;

            // Universal Lock Guard: isTransitioning TIDAK BOLEH terkunci lebih dari 3.5 detik dalam kondisi apapun
            if (window._transitionLockGuard) clearTimeout(window._transitionLockGuard);
            window._transitionLockGuard = setTimeout(() => {
                if (isTransitioning) {
                    console.warn('🚨 [Display TV Failsafe] isTransitioning dilepas paksa oleh timeout guard!');
                    isTransitioning = false;
                }
            }, 3500);

            const applyTransition = () => {
                if (transitioned) return;
                transitioned = true;
                if (slideTransitionFailsafe) {
                    clearTimeout(slideTransitionFailsafe);
                    slideTransitionFailsafe = null;
                }

                // Double requestAnimationFrame untuk sinkronisasi render V-Sync browser
                requestAnimationFrame(() => {
                    void backFrame.offsetWidth;
                    requestAnimationFrame(() => {
                        // Frame lama tetap solid di z-index 1 sebagai alas sempurna (tanpa penurunan cahaya)
                        frontFrame.className = 'outgoing';
                        // Frame baru di z-index 2 memudar masuk dengan sangat anggun & lembut di atasnya (A-over-B)
                        backFrame.className = 'active';

                        currentFrame = currentFrame === 1 ? 2 : 1;

                        try {
                            if (typeof broadcastTvState === 'function') {
                                broadcastTvState();
                            }
                        } catch (e) {
                            console.warn('[Display TV] Broadcast state exception caught:', e);
                        }

                        if (window.__SRE_TELEMETRY__) {
                            window.__SRE_TELEMETRY__.lastSlideSwitchTime = Date.now();
                            window.__SRE_TELEMETRY__.totalRotations++;
                        }

                        // Setelah transisi fade-in selesai sempurna (1.15s), bersihkan kelas frame lama ke standby
                        setTimeout(() => {
                            try {
                                if (frontFrame.classList.contains('outgoing')) {
                                    frontFrame.className = 'standby';
                                }
                            } catch (e) {
                                console.warn('[Display TV] Class cleanup warning:', e);
                            } finally {
                                isTransitioning = false;
                                if (window._transitionLockGuard) clearTimeout(window._transitionLockGuard);
                                // Proaktif preload slide berikutnya di latar belakang selagi slide ini tayang
                                preloadNextSlide();
                            }
                        }, 1200);
                    });
                });
            };

            // Jika slide berikutnya sudah selesai dipreload dan siap di backFrame
            if (backFrame.dataset.loadedUrl === nextUrl && backFrame.dataset.isReady === 'true') {
                applyTransition();
            } else {
                // Failsafe jika belum siap atau lompatan acak
                backFrame.dataset.loadedUrl = '';
                backFrame.dataset.isReady = 'false';
                backFrame.className = 'incoming';
                
                backFrame.onload = function() {
                    backFrame.dataset.loadedUrl = nextUrl;
                    backFrame.dataset.isReady = 'true';
                    try {
                        if (backFrame.contentWindow) {
                            backFrame.contentWindow.postMessage({
                                type: 'INIT_DISPLAY_DATA',
                                settings: settings,
                                jumatPetugas: jumatPetugas,
                                jadwalList: jadwalList,
                                programInfaqList: window.programInfaqList || []
                            }, '*');
                        }
                    } catch(e) {}
                    // Beri jeda 120ms agar initial paint, font, & script stabil sebelum fade-in
                    setTimeout(applyTransition, 120);
                };
                backFrame.onerror = function() {
                    applyTransition();
                };

                if (slideTransitionFailsafe) clearTimeout(slideTransitionFailsafe);
                slideTransitionFailsafe = setTimeout(() => {
                    applyTransition();
                    setTimeout(() => { isTransitioning = false; }, 1300);
                }, 2500);

                backFrame.src = nextUrl;
            }
        }

        function nextPage() {
            if (isPrayerModeActive || isYasinModeActive || isKajianModeActive) return;
            switchSlide(currentIndex + 1);
        }

        function prevPage() {
            if (isPrayerModeActive || isYasinModeActive || isKajianModeActive) return;
            switchSlide(currentIndex - 1);
        }

        function togglePause() {
            isPaused = !isPaused;
            showOsd(isPaused ? '⏸ Rotasi Dijeda' : '▶ Rotasi Dilanjutkan');
            try {
                if (typeof broadcastTvState === 'function') broadcastTvState();
            } catch(e) {}
            if (!isPaused) {
                scheduleNextRotation();
            } else {
                clearTimeout(rotationTimer);
            }
        }

        // Lompat langsung ke slide tertentu berdasarkan URL atau rute
        function jumpToSlideUrl(url, label = '') {
            if (!url || isPrayerModeActive) return;
            const targetIdx = activePages.findIndex(p => p.includes(url) || url.includes(p));
            if (targetIdx !== -1) {
                switchSlide(targetIdx);
                scheduleNextRotation();
            } else {
                if (isTransitioning) return;
                isTransitioning = true;
                const frontFrame = currentFrame === 1 ? document.getElementById('frame1') : document.getElementById('frame2');
                const backFrame = currentFrame === 1 ? document.getElementById('frame2') : document.getElementById('frame1');
                backFrame.className = 'incoming';
                backFrame.dataset.loadedUrl = '';
                backFrame.dataset.isReady = 'false';
                
                let transitioned = false;
                const applyCustomTransition = () => {
                    if (transitioned) return;
                    transitioned = true;
                    requestAnimationFrame(() => {
                        void backFrame.offsetWidth;
                        requestAnimationFrame(() => {
                            frontFrame.className = 'outgoing';
                            backFrame.className = 'active';
                            currentFrame = currentFrame === 1 ? 2 : 1;
                            showOsd(label ? `📺 ${label}` : '📺 Slide Khusus');

                            setTimeout(() => {
                                if (frontFrame.classList.contains('outgoing')) {
                                    frontFrame.className = 'standby';
                                }
                                isTransitioning = false;
                                preloadNextSlide();
                            }, 1200);
                        });
                    });
                };

                backFrame.onload = function() {
                    backFrame.dataset.loadedUrl = url;
                    backFrame.dataset.isReady = 'true';
                    setTimeout(applyCustomTransition, 120);
                };
                backFrame.onerror = function() {
                    applyCustomTransition();
                };
                setTimeout(applyCustomTransition, 2500);
                backFrame.src = url;
            }
        }

        // Tampilkan Banner Siaran Darurat / Pengumuman Jarak Jauh (Posisi Tengah Layar TV)
        let emergencyAlertTimer = null;
        function showEmergencyAlert(text, theme = 'red', duration = 30) {
            const banner = document.getElementById('emergencyBanner');
            const backdrop = document.getElementById('emergencyBackdrop');
            const txt = document.getElementById('emergencyText');
            const badgeTitle = document.getElementById('emergencyBadgeTitle');
            if (!banner || !txt) return;

            txt.textContent = text || 'Pemberitahuan Khusus DKM';
            banner.className = 'emergency-banner-overlay show';
            if (backdrop) backdrop.classList.add('show');

            if (theme === 'gold') {
                banner.classList.add('theme-gold');
                if (badgeTitle) badgeTitle.textContent = 'PENGUMUMAN DKM MASJID';
            } else if (theme === 'green') {
                banner.classList.add('theme-green');
                if (badgeTitle) badgeTitle.textContent = 'KABAR GEMBIRA & INFORMASI DKM';
            } else if (theme === 'blue') {
                banner.classList.add('theme-blue');
                if (badgeTitle) badgeTitle.textContent = 'INFORMASI UMUM MASJID';
            } else {
                // red (darurat / mendesak)
                if (badgeTitle) badgeTitle.textContent = 'SIARAN PENGUMUMAN DARURAT';
            }

            clearTimeout(emergencyAlertTimer);
            if (duration && duration > 0) {
                const timeoutMs = (duration > 1000) ? duration : (duration * 1000);
                emergencyAlertTimer = setTimeout(() => {
                    hideEmergencyAlert();
                }, timeoutMs);
            }
        }

        function hideEmergencyAlert() {
            const banner = document.getElementById('emergencyBanner');
            const backdrop = document.getElementById('emergencyBackdrop');
            if (!banner) return;
            banner.classList.remove('show');
            if (backdrop) backdrop.classList.remove('show');
            clearTimeout(emergencyAlertTimer);
        }

        function scheduleNextRotation() {
            clearTimeout(rotationTimer);
            if (isPaused || isPrayerModeActive || isYasinModeActive || isKajianModeActive || activePages.length <= 1) return;

            rotationTimer = setTimeout(() => {
                nextPage();
                scheduleNextRotation();
            }, rotationInterval);
        }

        // Kunci penayangan slide agenda khusus (Surat Yaasiin / Pengajian Rutin Malam Ahad)
        function lockSpecialAgendaSlide(url, label) {
            clearTimeout(rotationTimer);
            const frontFrame = currentFrame === 1 ? document.getElementById('frame1') : document.getElementById('frame2');
            const backFrame = currentFrame === 1 ? document.getElementById('frame2') : document.getElementById('frame1');

            const currentSrc = frontFrame.getAttribute('src') || '';
            if (currentSrc.includes(url) && frontFrame.classList.contains('active')) {
                return;
            }

            backFrame.className = 'incoming';
            backFrame.dataset.loadedUrl = '';
            backFrame.dataset.isReady = 'false';

            let transitioned = false;
            const applySpecialTransition = () => {
                if (transitioned) return;
                transitioned = true;
                requestAnimationFrame(() => {
                    void backFrame.offsetWidth;
                    requestAnimationFrame(() => {
                        frontFrame.className = 'outgoing';
                        backFrame.className = 'active';
                        currentFrame = currentFrame === 1 ? 2 : 1;
                        setTimeout(() => {
                            if (frontFrame.classList.contains('outgoing')) {
                                frontFrame.className = 'standby';
                            }
                            isTransitioning = false;
                        }, 1200);
                    });
                });
            };

            backFrame.onload = function() {
                backFrame.dataset.loadedUrl = url;
                backFrame.dataset.isReady = 'true';
                try {
                    if (backFrame.contentWindow) {
                        backFrame.contentWindow.postMessage({
                            type: 'INIT_DISPLAY_DATA',
                            settings: settings,
                            jumatPetugas: jumatPetugas,
                            jadwalList: jadwalList,
                            programInfaqList: window.programInfaqList || []
                        }, '*');
                    }
                } catch(e) {}
                setTimeout(applySpecialTransition, 120);
            };
            backFrame.onerror = function() {
                applySpecialTransition();
            };
            setTimeout(applySpecialTransition, 2500);
            backFrame.src = url;
        }

        // Pantau waktu sholat & agenda khusus (Prayer Mode Engine)
        function checkPrayerMode() {
            if (!window.PrayerEngine) return;
            const now = new Date();
            const state = window.PrayerEngine.getPrayerState(settings, jadwalList, jumatPetugas, now);

            const prayerFrame = document.getElementById('prayerFrame');

            // 1. Prioritas Utama: Prayer Mode (Adzan / Iqamah / Sholat Berjamaah)
            if (state.active) {
                if (!isPrayerModeActive) {
                    console.log('🕌 Memasuki Mode Sholat:', state.phase, state.prayer);
                    isPrayerModeActive = true;
                    clearTimeout(rotationTimer);
                    prayerFrame.classList.add('active');
                }
                return;
            } else {
                if (isPrayerModeActive) {
                    console.log('✅ Mode Sholat selesai. Kembali ke rotasi TV.');
                    isPrayerModeActive = false;
                    prayerFrame.classList.remove('active');
                    if (!isYasinModeActive && !isKajianModeActive) {
                        scheduleNextRotation();
                    }
                }
            }

            // 2. Prioritas Kedua: Agenda Malam Jum'at (Surat Yaasiin ba'da Maghrib s/d Isya)
            if (state.yasin_active) {
                if (!isYasinModeActive) {
                    console.log('📖 Agenda Malam Jum\'at Aktif: Mengunci layar pada Surat Yaasiin.');
                    isYasinModeActive = true;
                    localStorage.setItem('lockPageRotation', 'yasin');
                    clearTimeout(rotationTimer);
                    lockSpecialAgendaSlide('slides/yasin.html', '📖 Agenda Malam Jum\'at: Surat Yaasiin');
                } else {
                    // Pastikan timer rotasi tetap mati selagi mode yasin aktif
                    clearTimeout(rotationTimer);
                }
            } else if (isYasinModeActive) {
                console.log('✅ Agenda Malam Jum\'at selesai. Mengembalikan rotasi normal.');
                isYasinModeActive = false;
                localStorage.removeItem('lockPageRotation');
                scheduleNextRotation();
            }

            // 3. Prioritas Ketiga: Pengajian Rutin Malam Ahad (Kajian Sabtu Ba'da Maghrib s/d Isya)
            if (state.kajian_active) {
                if (!isKajianModeActive) {
                    console.log('🕌 Pengajian Rutin Malam Ahad Aktif: Mengunci layar pada Slide Kajian.');
                    isKajianModeActive = true;
                    localStorage.setItem('lockPageRotation', 'kajian');
                    clearTimeout(rotationTimer);
                    lockSpecialAgendaSlide('slides/kajian.html', '🕌 Pengajian Rutin Malam Ahad: Majelis Ilmu');
                } else {
                    // Pastikan timer rotasi tetap mati selagi mode kajian aktif
                    clearTimeout(rotationTimer);
                }
            } else if (isKajianModeActive) {
                console.log('✅ Pengajian Rutin Malam Ahad selesai. Mengembalikan rotasi normal.');
                isKajianModeActive = false;
                localStorage.removeItem('lockPageRotation');
                scheduleNextRotation();
            }
        }

        // Callback ketika prayer-mode.html selesai
        window.onPrayerModeEnd = function() {
            if (isPrayerModeActive) {
                console.log('✅ Mode Sholat selesai via callback. Kembali ke rotasi TV.');
                isPrayerModeActive = false;
                const prayerFrame = document.getElementById('prayerFrame');
                if (prayerFrame) prayerFrame.classList.remove('active');
                scheduleNextRotation();
            }
        };

        // Inisialisasi Utama
        async function initDisplay() {
            const statusEl = document.getElementById('splashStatus');
            try {
                if (statusEl) statusEl.textContent = 'MEMUAT DATA SUPABASE...';

                // 1. Ambil settings & data program infaq
                settings = await SupabaseDB.getSettings();
                let programInfaqList = [];
                try {
                    programInfaqList = await SupabaseDB.getProgramInfaq();
                } catch (e) {}

                if (settings) {
                    if (settings.nama_aplikasi) {
                        document.getElementById('splashTitle').textContent = settings.nama_aplikasi;
                        document.title = settings.nama_aplikasi + ' - Display TV';
                    }
                    if (settings.rotation_interval) {
                        const sec = Math.max(1, parseInt(settings.rotation_interval));
                        rotationInterval = sec * 1000;
                        localStorage.setItem('display_rotation_interval', sec);
                        console.log(`⏱️ [Display TV] Durasi rotasi disetel dari Cloud Supabase: ${sec} detik (${rotationInterval} ms)`);
                    }
                    // Sinkronisasi teks footer hak cipta yang diatur Super Admin
                    const footerText = settings.footer || localStorage.getItem('app_footer_text') || "© 2026 MASJID JAMI' AL JIHAD (GRAHA ASRI). All Rights Reserved";
                    updateMasterFooter(footerText);

                    activePages = resolveActivePages(settings, programInfaqList);
                } else {
                    const localFooter = localStorage.getItem('app_footer_text') || "© 2026 MASJID JAMI' AL JIHAD (GRAHA ASRI). All Rights Reserved";
                    updateMasterFooter(localFooter);
                }

                // 2. Ambil jadwal & petugas Jumat
                jadwalList = await SupabaseDB.getJadwalSholat();
                jumatPetugas = await SupabaseDB.getSholatJumat();
                window.settings = settings;
                window.jumatPetugas = jumatPetugas;
                window.jadwalList = jadwalList;
                window.programInfaqList = programInfaqList;

                // Cek langsung apakah saat inisialisasi sedang dalam waktu Sholat atau Agenda Khusus (Yasin / Kajian)
                const initialState = window.PrayerEngine ? window.PrayerEngine.getPrayerState(settings, jadwalList, jumatPetugas, new Date()) : null;
                const isInitialYasin = initialState && initialState.yasin_active;
                const isInitialKajian = initialState && initialState.kajian_active;

                // 3. Muat slide pertama
                if (isInitialYasin) {
                    console.log('📖 [Display TV Init] Memulai langsung pada Agenda Surat Yaasiin');
                    isYasinModeActive = true;
                    localStorage.setItem('lockPageRotation', 'yasin');
                    const f1 = document.getElementById('frame1');
                    f1.src = 'slides/yasin.html';
                    f1.dataset.loadedUrl = 'slides/yasin.html';
                    f1.dataset.isReady = 'true';
                } else if (isInitialKajian) {
                    console.log('🕌 [Display TV Init] Memulai langsung pada Agenda Kajian');
                    isKajianModeActive = true;
                    localStorage.setItem('lockPageRotation', 'kajian');
                    const f1 = document.getElementById('frame1');
                    f1.src = 'slides/kajian.html';
                    f1.dataset.loadedUrl = 'slides/kajian.html';
                    f1.dataset.isReady = 'true';
                } else if (activePages.length > 0) {
                    const f1 = document.getElementById('frame1');
                    f1.onload = function() {
                        f1.dataset.loadedUrl = activePages[0];
                        f1.dataset.isReady = 'true';
                        try {
                            if (f1.contentWindow) {
                                f1.contentWindow.postMessage({
                                    type: 'INIT_DISPLAY_DATA',
                                    settings: settings,
                                    jumatPetugas: jumatPetugas,
                                    jadwalList: jadwalList,
                                    programInfaqList: programInfaqList
                                }, '*');
                            }
                        } catch(e) {}
                    };
                    f1.src = activePages[0];
                    f1.dataset.loadedUrl = activePages[0];
                    f1.dataset.isReady = 'true';
                    currentIndex = 0;
                }

                // 4. Sembunyikan splash screen & mulai preload slide berikutnya
                setTimeout(() => {
                    const overlay = document.getElementById('loadingOverlay');
                    if (overlay) {
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 600);
                    }
                    if (!isInitialYasin && !isInitialKajian) {
                        preloadNextSlide();
                        scheduleNextRotation();
                    }
                }, 1200);

            } catch (err) {
                console.error('Inisialisasi gagal:', err);
                if (statusEl) statusEl.textContent = 'MEMUAT MODE CADANGAN...';
                activePages = DEFAULT_PAGES;
                document.getElementById('frame1').src = activePages[0];
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    scheduleNextRotation();
                }, 1000);
            }
        }

        // Listener Keyboard / Remote TV
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowRight':
                case 'MediaTrackNext':
                    if (isPrayerModeActive || isYasinModeActive || isKajianModeActive) break;
                    nextPage();
                    scheduleNextRotation();
                    break;
                case 'ArrowLeft':
                case 'MediaTrackPrevious':
                    if (isPrayerModeActive || isYasinModeActive || isKajianModeActive) break;
                    prevPage();
                    scheduleNextRotation();
                    break;
                case ' ':
                case 'MediaPlayPause':
                    e.preventDefault();
                    togglePause();
                    break;
                case 'r':
                case 'R':
                    location.reload();
                    break;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initDisplay();
            setInterval(checkPrayerMode, 1000);

            // Helper Broadcast Data ke Iframes yang Sedang Aktif di Layar TV
            function broadcastToActiveFrames(message) {
                try {
                    const f1 = document.getElementById('frame1');
                    const f2 = document.getElementById('frame2');
                    if (f1 && f1.contentWindow) {
                        f1.contentWindow.postMessage(message, '*');
                    }
                    if (f2 && f2.contentWindow) {
                        f2.contentWindow.postMessage(message, '*');
                    }
                } catch(e) {
                    console.warn('[Display TV] Broadcast to active frames warning:', e);
                }
            }

            // =====================================================
            // UNIVERSAL REALTIME DATA HANDLER UNTUK DISPLAY TV
            // =====================================================
            function handleUniversalDataUpdate(event) {
                const table = (event.table || '').toLowerCase();
                const action = event.action || 'UPDATE';
                const data = event.data || {};
                console.log(`⚡ [Display TV Realtime Update]: table=${table}, action=${action}`, data);

                // 1. Sebarkan ke seluruh active frame (frameA & frameB)
                broadcastToActiveFrames({
                    type: 'DATA_UPDATED',
                    table: table,
                    action: action,
                    data: data,
                    payload: event
                });

                // 2. Refresh komponen internal TV master jika berkaitan
                if (table === 'app_settings') {
                    Promise.all([SupabaseDB.getSettings(), SupabaseDB.getProgramInfaq()]).then(([newSettings, progs]) => {
                        if (newSettings) {
                            settings = newSettings;
                            window.settings = settings;
                        }
                        if (settings && settings.rotation_interval) {
                            rotationInterval = Math.max(1, parseInt(settings.rotation_interval)) * 1000;
                            localStorage.setItem('display_rotation_interval', settings.rotation_interval);
                            scheduleNextRotation();
                        }
                        if (settings && settings.footer) {
                            updateMasterFooter(settings.footer);
                        }
                        activePages = resolveActivePages(settings, progs);
                        showOsd(`⚡ Pengaturan TV Diperbarui`);
                    });
                } else if (table === 'program_infaq' || table === 'donasi_infaq') {
                    Promise.all([SupabaseDB.getSettings(), SupabaseDB.getProgramInfaq()]).then(([currSettings, progs]) => {
                        if (currSettings) settings = currSettings;
                        activePages = resolveActivePages(settings, progs);
                        showOsd('⚡ Infaq Diperbarui (Realtime)');
                    });
                } else if (table === 'jadwal_sholat') {
                    SupabaseDB.getJadwalSholat().then(list => {
                        jadwalList = list;
                        if (typeof updatePrayerTimesBar === 'function') {
                            updatePrayerTimesBar();
                        }
                        showOsd('⚡ Jadwal Sholat Diperbarui');
                    });
                } else if (table === 'sholat_jumat') {
                    if (data && (data.imam || data.tanggal)) {
                        jumatPetugas = Object.assign({}, jumatPetugas || {}, data);
                        window.jumatPetugas = jumatPetugas;
                    }
                    SupabaseDB.getSholatJumat().then(petugas => {
                        if (petugas) {
                            jumatPetugas = petugas;
                            window.jumatPetugas = jumatPetugas;
                        }
                    });
                    showOsd("⚡ Petugas Jum'at Diperbarui");
                } else if (table === 'running_text') {
                    if (data && data.text) {
                        updateMasterFooter(data.text);
                    }
                }

                // 3. SEGERA RE-RENDER JIKA SLIDE YANG SEDANG TAYANG DI TV RELEVAN DENGAN DATA
                // Agar penginputan data di laptop/HP seketika (<100ms) tayang di layar TV masjid
                try {
                    const currentUrl = (activePages && activePages[currentIndex]) ? activePages[currentIndex].toLowerCase() : '';
                    const tableSlideMapping = {
                        'keuangan': ['keuangan', 'kas-jumat', 'keuangan-summary', 'utama'],
                        'keuangan_ambulance': ['ambulance', 'utama'],
                        'sholat_jumat': ['jumat', 'kas-jumat', 'utama'],
                        'pengumuman_jumat': ['jumat', 'kas-jumat'],
                        'program_infaq': ['infaq', 'utama'],
                        'donasi_infaq': ['infaq', 'utama'],
                        'kajian': ['kajian', 'utama'],
                        'agenda_rutin': ['agenda-rutin', 'utama'],
                        'ramadhan': ['ramadhan', 'utama'],
                        'qurban': ['qurban', 'utama'],
                        'qris': ['qris'],
                        'slides': ['slide'],
                        'undangan': ['undangan'],
                        'yasin': ['yasin'],
                        'yasin_settings': ['yasin'],
                        'sholat_idul_fitri': ['idul-fitri'],
                        'idul_fitri': ['idul-fitri'],
                        'sholat_idul_adha': ['idul-adha'],
                        'idul_adha': ['idul-adha'],
                        'hikmah': ['hikmah'],
                        'live_tv': ['live-mekah', 'live-madinah', 'live-mimbar'],
                        'live_mekah': ['live-mekah'],
                        'live_madinah': ['live-madinah'],
                        'cctv_mimbar': ['live-mimbar'],
                        'jadwal_sholat': ['utama', 'jumat', 'yasin', 'kajian', 'kas-jumat'],
                        'app_settings': ['utama', 'keuangan', 'ambulance', 'jumat', 'kas-jumat', 'pengumuman', 'keuangan-summary', 'qris', 'slide', 'infaq', 'hikmah', 'qurban', 'yasin', 'live-mekah', 'live-madinah', 'live-mimbar', 'idul-fitri', 'idul-adha', 'ramadhan', 'kajian', 'agenda-rutin', 'undangan']
                    };

                    const relatedKeywords = tableSlideMapping[table] || [];
                    const isCurrentSlideRelated = relatedKeywords.some(kw => currentUrl.includes(kw));

                    if (isCurrentSlideRelated) {
                        const f1 = document.getElementById('frame1');
                        const f2 = document.getElementById('frame2');
                        const payload = {
                            type: 'DATA_UPDATED',
                            table: table,
                            action: action,
                            data: data,
                            jumatPetugas: jumatPetugas,
                            settings: settings,
                            force_reload: true
                        };
                        if (f1 && f1.contentWindow) {
                            try { f1.contentWindow.postMessage(payload, '*'); } catch(e) {}
                        }
                        if (f2 && f2.contentWindow) {
                            try { f2.contentWindow.postMessage(payload, '*'); } catch(e) {}
                        }
                    }
                } catch (e) {
                    console.warn('[Display TV] Quick refresh active slide error:', e);
                }
            }

            // Pasang Pendengar Universal Realtime (Postgres Changes, Remote Broadcast, Local Channel, Storage)
            if (window.SupabaseDB && typeof SupabaseDB.onDataChange === 'function') {
                SupabaseDB.onDataChange(handleUniversalDataUpdate);
            } else if (window.SupabaseDB && typeof SupabaseDB.subscribeRealtime === 'function') {
                SupabaseDB.subscribeRealtime((payload) => {
                    handleUniversalDataUpdate({
                        table: payload.table,
                        action: payload.eventType || 'UPDATE',
                        data: payload.new || payload.old || {}
                    });
                });
            }

            // Pasang Pendengar Remote Control Supabase (Perintah Jarak Jauh Super Admin)
            if (window.SupabaseDB && typeof SupabaseDB.subscribeRemoteCommands === 'function') {
                SupabaseDB.subscribeRemoteCommands((payload) => {
                    const cmd = (payload.command || '').toUpperCase();
                    const d = payload.data || {};
                    console.log('📡 [TV Remote Command Received]:', cmd, d);

                    switch (cmd) {
                        case 'DATA_UPDATED':
                            handleUniversalDataUpdate({
                                table: d.table,
                                action: d.action || 'UPDATE',
                                data: d.data || {}
                            });
                            break;
                        case 'SYNC_KEUANGAN':
                            handleUniversalDataUpdate({ table: 'keuangan', action: 'SYNC', data: d });
                            break;
                        case 'SYNC_AMBULANCE':
                            handleUniversalDataUpdate({ table: 'keuangan_ambulance', action: 'SYNC', data: d });
                            break;
                        case 'SYNC_JUMAT':
                            handleUniversalDataUpdate({ table: 'sholat_jumat', action: 'SYNC', data: d });
                            break;
                        case 'SYNC_INFAQ':
                            handleUniversalDataUpdate({ table: 'program_infaq', action: 'SYNC', data: d });
                            break;
                        case 'SYNC_KAJIAN':
                            handleUniversalDataUpdate({ table: 'kajian', action: 'SYNC', data: d });
                            broadcastToActiveFrames({ type: 'SYNC_KAJIAN', data: d });
                            break;
                        case 'SYNC_AGENDA_RUTIN':
                            handleUniversalDataUpdate({ table: 'agenda_rutin', action: 'SYNC', data: d });
                            broadcastToActiveFrames({ type: 'SYNC_AGENDA_RUTIN', data: d });
                            break;
                        case 'SYNC_PENGUMUMAN_JUMAT':
                            handleUniversalDataUpdate({ table: 'pengumuman_jumat', action: 'SYNC', data: d });
                            broadcastToActiveFrames({ type: 'SYNC_PENGUMUMAN_JUMAT', data: d });
                            break;
                        case 'SYNC_RAMADHAN':
                            handleUniversalDataUpdate({ table: 'ramadhan', action: 'SYNC', data: d });
                            broadcastToActiveFrames({ type: 'SYNC_RAMADHAN', data: d });
                            break;
                        case 'UPDATE_SETTINGS':
                            handleUniversalDataUpdate({ table: 'app_settings', action: 'UPDATE', data: d });
                            if (d.rotation_interval) {
                                rotationInterval = Math.max(1, parseInt(d.rotation_interval)) * 1000;
                                localStorage.setItem('display_rotation_interval', d.rotation_interval);
                                scheduleNextRotation();
                                showOsd(`⚡ Remote: Durasi Rotasi ${d.rotation_interval} detik`);
                            }
                            if (d.footer) {
                                updateMasterFooter(d.footer);
                            }
                            broadcastToActiveFrames({ type: 'UPDATE_SETTINGS', data: d });
                            break;
                        case 'NEXT':
                            if (isPrayerModeActive || isYasinModeActive || isKajianModeActive) break;
                            nextPage();
                            scheduleNextRotation();
                            showOsd('🎮 Remote: Slide Berikutnya');
                            break;
                        case 'PREV':
                            if (isPrayerModeActive || isYasinModeActive || isKajianModeActive) break;
                            prevPage();
                            scheduleNextRotation();
                            showOsd('🎮 Remote: Slide Sebelumnya');
                            break;
                        case 'PAUSE':
                            if (!isPaused) togglePause();
                            break;
                        case 'RESUME':
                            if (isPaused) togglePause();
                            break;
                        case 'TOGGLE_PAUSE':
                            togglePause();
                            break;
                        case 'JUMP':
                            jumpToSlideUrl(d.url, d.name);
                            break;
                        case 'RELOAD':
                        case 'REFRESH_DISPLAY':
                            showOsd('🔄 Remote: Memuat Ulang TV...');
                            setTimeout(() => {
                                try {
                                    window.location.reload(true);
                                } catch(e) {
                                    window.location.reload();
                                }
                            }, 1200);
                            break;
                        case 'EMERGENCY_ALERT':
                            showEmergencyAlert(d.text, d.theme, d.duration || 30);
                            showOsd('📢 Peringatan Siaran Darurat Masuk');
                            break;
                        case 'CLEAR_ALERT':
                            hideEmergencyAlert();
                            showOsd('✅ Peringatan Dihapus');
                            break;
                        case 'PING':
                            showOsd('📡 Ping Sukses dari Super Admin (Online)');
                            break;
                    }
                });

                // Inisialisasi awal kehadiran TV dan interval berkala setiap 15 detik
                setTimeout(broadcastTvState, 1500);
                setInterval(broadcastTvState, 15000);
            }

            // PWA Service Worker Registration with Instant Auto-Reload on Real Updates (Anti-Loop on First Visit)
            if ('serviceWorker' in navigator) {
                let isRefreshing = false;
                let hadController = Boolean(navigator.serviceWorker.controller);
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    // Cegah reload loop saat kunjungan pertama kali (uncontrolled -> controlled)
                    if (!hadController) {
                        hadController = true;
                        return;
                    }
                    if (!isRefreshing) {
                        isRefreshing = true;
                        console.log('🔄 [PWA] Versi baru terdeteksi & aktif, memuat ulang halaman otomatis...');
                        window.location.reload();
                    }
                });

                navigator.serviceWorker.register('sw.js').then((reg) => {
                    console.log('✅ [PWA] Service Worker aktif:', reg.scope);
                }).catch((err) => {
                    console.log('ℹ️ [PWA] Service Worker info:', err);
                });
            }

            // Network Connectivity Resilience Listener (Offline Toast Indicator)
            window.addEventListener('offline', () => {
                showOsd('📡 Mode Offline Aktif - Menggunakan Data Cache Lokal');
            });
            window.addEventListener('online', () => {
                showOsd('⚡ Terhubung Kembali ke Internet');
            });

            // Touch Swipe Handler for Mobile & Tablet Devices (Swipe Left/Right to Switch Slides)
            let touchStartX = 0;
            let touchEndX = 0;
            document.addEventListener('touchstart', (e) => {
                if (e.changedTouches && e.changedTouches[0]) {
                    touchStartX = e.changedTouches[0].screenX;
                }
            }, { passive: true });
            document.addEventListener('touchend', (e) => {
                if (e.changedTouches && e.changedTouches[0]) {
                    touchEndX = e.changedTouches[0].screenX;
                    const diff = touchEndX - touchStartX;
                    if (Math.abs(diff) > 60) {
                        if (isPrayerModeActive || isYasinModeActive || isKajianModeActive) return;
                        if (diff < 0) {
                            nextPage();
                        } else {
                            prevPage();
                        }
                        scheduleNextRotation();
                    }
                }
            }, { passive: true });

            // SRE Rotation Watchdog (Mencegah Layar TV Freeze Akibat Background Sleep / Tab Throttling)
            setInterval(() => {
                if (isPaused || isPrayerModeActive || isYasinModeActive || isKajianModeActive) return;
                const elapsed = Date.now() - (window.__SRE_TELEMETRY__ ? window.__SRE_TELEMETRY__.lastSlideSwitchTime : Date.now());
                if (elapsed > (rotationInterval + 10000)) {
                    if (window.__SRE_TELEMETRY__) {
                        window.__SRE_TELEMETRY__.log('WATCHDOG', `Rotasi tertahan selama ${Math.round(elapsed/1000)} detik, memicu auto-recovery...`);
                    }
                    console.warn(`[Watchdog Auto-Recovery] Rotasi tertahan selama ${Math.round(elapsed/1000)} detik, melepas kunci dan lanjut slide...`);
                    isTransitioning = false; // Lepas kunci transisi secara paksa jika ada kegagalan tak terduga
                    nextPage();
                    scheduleNextRotation();
                }
            }, 4000);
        });
    </script>
