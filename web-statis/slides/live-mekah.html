<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Streaming Ka'bah Makkah Al-Mukarramah - Display TV</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../vendor/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../css/display-theme.css?v=20261006_06">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050807;
            font-family: 'Poppins', sans-serif;
            color: #FFFFFF;
            user-select: none;
        }

        /* 1. LAYER VIDEO STREAMING */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            background: #000000 url('../image/display/background/kaabah.webp') center center / cover no-repeat;
        }

        .video-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%) scale(1.06);
            border: none;
            pointer-events: none;
        }

        @media (min-aspect-ratio: 16/9) {
            .video-container iframe { height: 56.25vw; }
        }
        @media (max-aspect-ratio: 16/9) {
            .video-container iframe { width: 177.78vh; }
        }

        /* VIGNETTE OVERLAY */
        .vignette-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.65) 100%),
                        linear-gradient(180deg, rgba(3, 15, 8, 0.85) 0%, rgba(0,0,0,0.1) 22%, rgba(0,0,0,0.1) 75%, rgba(2, 10, 5, 0.95) 100%);
        }

        /* 2. OVERLAY SMART MOSQUE */
        .mosque-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px 36px 16px 36px;
            pointer-events: none;
        }

        .overlay-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .channel-info-box {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(8, 28, 18, 0.85);
            border: 1.5px solid rgba(212, 175, 55, 0.55);
            padding: 10px 22px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .live-pulse-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #E11D48;
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 5px 12px;
            border-radius: 30px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.6);
        }

        .pulse-dot {
            width: 9px;
            height: 9px;
            background-color: #FFFFFF;
            border-radius: 50%;
            animation: pulseAnim 1.2s infinite ease-in-out;
        }

        @keyframes pulseAnim {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .channel-text h2 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            line-height: 1.1;
        }

        .channel-text p {
            font-size: 0.82rem;
            color: #cbd5e1;
            letter-spacing: 1px;
            margin-top: 3px;
        }

        /* CLOCK & PRAYER PILL */
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .clock-box {
            background: rgba(8, 28, 18, 0.85);
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            padding: 8px 22px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            text-align: right;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .live-time {
            font-size: 1.65rem;
            font-weight: 800;
            color: #ffd700;
            letter-spacing: 1px;
            font-family: monospace;
            line-height: 1;
        }

        .live-date {
            font-size: 0.80rem;
            color: #e2e8f0;
            margin-top: 4px;
        }

        /* FOOTER RUNNING TEXT */
        .bottom-running-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 20;
            background: rgba(2, 16, 11, 0.88);
            border-top: 1.5px solid rgba(255, 215, 0, 0.4);
            backdrop-filter: blur(10px);
        }
        .running-text-container { padding: 8px 20px; overflow: hidden; white-space: nowrap; }
        .running-text {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 68s linear infinite;
            font-size: 1.20rem;
            font-weight: 600;
            color: #ffffff;
        }
        .running-text i { color: #ffd700; margin: 0 10px; }
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>

<body>
    <!-- 1. LAYER VIDEO STREAMING -->
    <div class="video-container">
        <iframe id="videoIframe"
                src="" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
        </iframe>
    </div>

    <div class="vignette-overlay"></div>

    <!-- 2. SMART MOSQUE OVERLAY -->
    <div class="mosque-overlay">
        <div class="overlay-header">
            <div class="channel-info-box">
                <div class="live-pulse-container">
                    <span class="pulse-dot"></span>
                    <span>LIVE</span>
                </div>
                <div class="channel-text">
                    <h2>MAKKAH AL-MUKARRAMAH</h2>
                    <p id="channelSubText">Siaran Langsung 24 Jam Masjidil Haram (Ka'bah)</p>
                </div>
            </div>

            <div class="header-right">
                <div class="clock-box">
                    <div class="live-time" id="clockDisplay">--:--:--</div>
                    <div class="live-date" id="dateDisplay">Memuat Waktu...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER RUNNING TEXT -->
    <div class="bottom-running-wrap">
        <div class="running-badge"><i class="fas fa-kaaba"></i> LIVE MAKKAH</div>
        <div class="running-text-container">
            <div class="running-text" id="runningTextContent">
                <i class="fas fa-kaaba"></i> Siaran Langsung 24 Jam Masjidil Haram Makkah Al-Mukarramah. Labbaikallahumma Labbaik.
            </div>
        </div>
    </div>

    <!-- CORE SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-db.js"></script>

    <script>
        function updateClock() {
            const now = new Date();
            const days = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', "Jum'at", 'Sabtu'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Juni', 'Juli', 'Agst', 'Sept', 'Okt', 'Nov', 'Des'];

            const dayName = days[now.getDay()];
            const dateStr = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            document.getElementById('clockDisplay').textContent = timeStr;
            document.getElementById('dateDisplay').textContent = `${dayName}, ${dateStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function loadStreamSettings() {
            try {
                let settings = null;
                try {
                    if (window.parent && window.parent !== window && window.parent.settings) {
                        settings = window.parent.settings;
                    }
                } catch (e) {}

                if (!settings && window.SupabaseDB) {
                    settings = await SupabaseDB.getSettings();
                }

                const localMekah = localStorage.getItem('live_makkah_url');
                const dbMekah = settings ? settings.live_makkah_url : '';
                let rawUrl = (localMekah && !localMekah.includes('live_stream?channel=')) 
                    ? localMekah 
                    : ((dbMekah && !dbMekah.includes('live_stream?channel=')) ? dbMekah : '');

                if (!rawUrl) {
                    rawUrl = 'https://www.youtube.com/watch?v=eC4LfEVxvKg';
                }

                if (settings) {
                    const rText = (window.SupabaseDB && typeof SupabaseDB.getRunningTextForPage === 'function')
                        ? SupabaseDB.getRunningTextForPage('/live-mekah-embed', settings)
                        : (settings.running_text || '');
                    if (rText) document.getElementById('runningTextContent').innerHTML = `<i class="fas fa-kaaba"></i> ${rText}`;
                }

                if (rawUrl) {
                    const embedUrl = (window.SupabaseDB && typeof SupabaseDB.formatYouTubeEmbed === 'function')
                        ? SupabaseDB.formatYouTubeEmbed(rawUrl)
                        : rawUrl;
                    if (embedUrl) {
                        const iframe = document.getElementById('videoIframe');
                        if (iframe && iframe.src !== embedUrl) {
                            iframe.src = embedUrl;
                        }
                    }
                }
            } catch (err) {
                console.error('Gagal memuat setting streaming:', err);
            }
        }

        // Fast immediate load dari localStorage agar tampilan instan tanpa jeda
        try {
            let fastMekah = localStorage.getItem('live_makkah_url');
            if (!fastMekah || fastMekah.includes('live_stream?channel=')) {
                fastMekah = 'https://www.youtube.com/watch?v=eC4LfEVxvKg';
            }
            if (window.SupabaseDB && SupabaseDB.formatYouTubeEmbed) {
                const fastEmbed = SupabaseDB.formatYouTubeEmbed(fastMekah);
                if (fastEmbed) {
                    const iframe = document.getElementById('videoIframe');
                    if (iframe) iframe.src = fastEmbed;
                }
            }
        } catch (e) {}

        document.addEventListener('DOMContentLoaded', () => {
            loadStreamSettings();

            // 1. Dengarkan pesan langsung dari Parent TV (postMessage) untuk respon seketika (<50ms)
            window.addEventListener('message', (event) => {
                const msg = event.data;
                if (!msg) return;
                if (msg.type === 'INIT_DISPLAY_DATA') {
                    loadStreamSettings();
                } else if (msg.type === 'DATA_UPDATED' && (msg.table === 'live_tv' || msg.table === 'live_mekah' || msg.table === 'app_settings')) {
                    loadStreamSettings();
                } else if (msg.type === 'UPDATE_SETTINGS' || msg.force_reload) {
                    loadStreamSettings();
                }
            });

            // 2. Dengarkan sinyal universal realtime (BroadcastChannel, Remote WebSocket, Storage)
            if (window.SupabaseDB && typeof SupabaseDB.onDataChange === 'function') {
                SupabaseDB.onDataChange((payload) => {
                    const tbl = (payload.table || '').toLowerCase();
                    if (tbl === 'live_tv' || tbl === 'live_mekah' || tbl === 'app_settings') {
                        loadStreamSettings();
                    }
                });
            } else if (window.SupabaseDB && typeof SupabaseDB.subscribeRealtime === 'function') {
                SupabaseDB.subscribeRealtime((payload) => {
                    if (payload.table === 'app_settings') {
                        loadStreamSettings();
                    }
                });
            }
        });
    </script>
</body>
</html>
